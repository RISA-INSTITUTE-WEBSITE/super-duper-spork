name: One-time RISA homepage formatting

on:
  push:
    branches: [feat/homepage-four-photo-fade]

permissions:
  contents: write

jobs:
  format-homepage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format failing files
        run: |
          npx prettier --write docs/assets/RISA-HERO-PHOTOS.md src/app/loading.tsx src/components/hero-photo-background.tsx
          git diff --check
      - name: Commit only formatting changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/assets/RISA-HERO-PHOTOS.md src/app/loading.tsx src/components/hero-photo-background.tsx
            git commit -m "style(home): format hero slideshow and loading components"
            git push origin HEAD:feat/homepage-four-photo-fade
          else
            echo "Already formatted"
          fi
