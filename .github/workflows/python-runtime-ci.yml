name: Python Studio browser verification

on:
  pull_request:
    paths:
      - "src/python-sandbox/**"
      - "src/app/python-sandbox.html/**"
      - "src/components/use-browser-python.ts"
      - "src/components/risa-programming-ide.tsx"
      - "tests/e2e/practical-workspace.spec.ts"
      - ".github/workflows/python-runtime-ci.yml"

permissions:
  contents: read

jobs:
  python-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/practical-workspace.spec.ts --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: python-studio-browser-diagnostics
          path: test-results/
