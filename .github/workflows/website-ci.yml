name: RISA Website CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "chore/**", "feature/**"]

concurrency:
  group: risa-website-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  required-quality-gate:
    name: RISA Required Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up supported Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Phase 1 - fastest, read-only static checks.
      - name: Phase 1 - Formatting without modifications
        run: npm run format:check

      - name: Phase 1 - ESLint, complexity and TypeScript
        run: |
          npm run lint
          npm run typecheck

      # Phase 2 - secrets, dependencies and source security.
      - name: Phase 2 - Full-history secret scan
        run: |
          docker run --rm \
            -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git --redact --exit-code 1 .

      - name: Phase 2 - Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Phase 2 - Dependency license audit
        run: node scripts/license-audit.mjs

      - name: Phase 2 - Semgrep SAST rules
        run: |
          python3 -m pip install --quiet semgrep
          semgrep scan --config .semgrep.yml --error --metrics off src

      # Phase 3 - build and unit verification.
      - name: Phase 3 - Production build
        run: npm run build

      - name: Phase 3 - Unit coverage threshold
        run: npm run test:coverage

      # Phase 4 - integration and infrastructure tests.
      - name: Phase 4 - Infrastructure-as-code scan (when applicable)
        run: |
          if find . -type f \( -name 'Dockerfile*' -o -name '*.tf' -o -name '*.tf.json' -o -name 'kustomization.yaml' \) -not -path './node_modules/*' | grep -q .; then
            python3 -m pip install --quiet checkov
            checkov -d . --framework dockerfile,terraform,kubernetes --quiet --compact
          else
            echo "No Docker/Terraform/Kubernetes deployment files yet; IaC scan not applicable."
          fi

      - name: Phase 4 - Production HTTP smoke and response headers
        run: |
          set -euo pipefail
          npm run start -- --hostname 0.0.0.0 --port 3000 > /tmp/risa-next.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          ready=0
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/risa-next.log
            exit 1
          fi
          for page in / /about /contact /programmes; do
            curl --fail --silent --show-error "http://127.0.0.1:3000$page" > /dev/null
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/missing-route)" = "404"
          curl -fsSI http://127.0.0.1:3000/ | grep -qi '^x-content-type-options: nosniff'
          curl -fsSI http://127.0.0.1:3000/ | grep -qi '^x-frame-options: DENY'
          curl -fsSI http://127.0.0.1:3000/ | grep -qi '^content-security-policy:'

      # Phase 5 - dynamic baseline and real-browser critical journeys.
      - name: Phase 5 - OWASP ZAP isolated active DAST scan
        run: |
          set -euo pipefail
          npm run start -- --hostname 0.0.0.0 --port 3000 > /tmp/risa-zap-next.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          ready=0
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          docker run --rm --network host \
            -v "$PWD:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py -t http://127.0.0.1:3000 \
              -c .zap/rules.conf -m 1 -J zap-report.json

      - name: Phase 5 - Install Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Phase 5 - Playwright end-to-end tests
        run: npm run test:e2e

      - name: Phase 5 - Node.js 24 portability build and tests
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Phase 5 - Validate portable build on Node.js 24
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run test:coverage
          npm run build

      - name: Preserve DAST scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risa-zap-report
          path: zap-report.json
          if-no-files-found: ignore
