name: RISA Website CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  push:
    branches: [main, "chore/**", "feature/**"]
  schedule:
    # 02:30 SAST (00:30 UTC).
    - cron: "30 0 * * *"
  workflow_dispatch:

concurrency:
  group: risa-website-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  changes:
    name: Determine verification scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dast: ${{ steps.scope.outputs.dast }}
      portability: ${{ steps.scope.outputs.portability }}
      iac: ${{ steps.scope.outputs.iac }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select extended checks (fail closed on unknown changes)
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          RELEASE_PR: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release') }}
        run: |
          set -euo pipefail
          dast=false
          portability=false
          iac=false
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$RELEASE_PR" == "true" || ( "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ) ]]; then
            dast=true
            portability=true
            iac=true
          fi
          if [[ -z "$BASE" ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            dast=true
            portability=true
            iac=true
          else
            git diff --name-only "$BASE" "$GITHUB_SHA" > "$RUNNER_TEMP/risa-changed-files"
            if grep -Eq '(^|/)(package(-lock)?\.json|\.npmrc|\.node-version|\.nvmrc|next\.config\.[^/]+)$|^\.github/workflows/website-ci\.yml$' "$RUNNER_TEMP/risa-changed-files"; then
              portability=true
            fi
            if grep -Eq '(^|/)(Dockerfile[^/]*|[^/]+\.tf(\.json)?|kustomization\.ya?ml)$|(^|/)(k8s|kubernetes|infra|terraform)/|^\.github/workflows/website-ci\.yml$' "$RUNNER_TEMP/risa-changed-files"; then
              iac=true
            fi
            if grep -Eq '^\.github/workflows/website-ci\.yml$|^tests/security/|^src/(middleware|proxy)\.|^src/app/(api|students)/|^src/lib/.*(auth|session|security)' "$RUNNER_TEMP/risa-changed-files"; then
              dast=true
            fi
          fi
          printf 'dast=%s\nportability=%s\niac=%s\n' "$dast" "$portability" "$iac" >> "$GITHUB_OUTPUT"
          printf 'DAST: %s; Node 24: %s; IaC: %s\n' "$dast" "$portability" "$iac" >> "$GITHUB_STEP_SUMMARY"

  code-quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        id: install
        run: npm ci --no-audit --no-fund
      - name: Prettier (read-only)
        run: npm run format:check
      - name: ESLint and complexity
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: TypeScript
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

  security:
    name: Security and license compliance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        id: install
        run: npm ci --no-audit --no-fund
      # QA-SEC-01: Gitleaks checks Git history for credentials, failing on findings.
      - name: Phase 2 - Full-history secret scan
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          docker run --rm \
            -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git --redact --exit-code 1 .

      # QA-SEC-02: temporarily non-blocking by explicit owner request.
      # The scan still runs and reports failures; issue #4 stays open.
      - name: Phase 2 - Dependency vulnerability audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        id: dependency_audit
        continue-on-error: true
        run: npm audit --audit-level=high

      # QA-SEC-03: blocking audit of exact approved package/versions/licenses.
      # Owner's recorded inclusion decision: docs/compliance/THIRD-PARTY-APPROVALS.md.
      # A future license, version or package change must fail the gate.
      - name: Phase 2 - Dependency license audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node tests/security/assert-license-policy.mjs
          node scripts/quality/license-audit.mjs

      # The vulnerability audit remains temporarily non-blocking by prior owner
      # instruction. Its future failures are visible and require follow-up.
      - name: Report temporary audit exceptions
        if: ${{ always() && steps.dependency_audit.outcome == 'failure' }}
        run: |
          echo "::warning title=Dependency audit exception::The dependency audit failed but is temporarily non-blocking; investigate any new advisory before release."

      # QA-SAST-01: project-specific source security rules from tests/security/.
      - name: Phase 2 - Semgrep SAST rules
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          python3 -m pip install --quiet semgrep
          semgrep scan --config tests/security/semgrep.yml --error --metrics off src

  unit-tests:
    name: Unit tests and 80% coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        id: install
        run: npm ci --no-audit --no-fund
      - name: Unit coverage threshold
        run: npm run test:coverage

  build-browser:
    name: Production build, HTTP and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        id: install
        run: npm ci --no-audit --no-fund
      - name: Production build
        id: build
        run: npm run build

      # QA-HTTP-01..03: run a built server, assert routes, 404 and security headers.
      # The executable assertions are documented in tests/integration/http-smoke.sh.
      - name: Phase 4 - Production HTTP smoke and response headers
        run: bash tests/integration/http-smoke.sh
      # Provision the actual browser used for end-to-end acceptance.
      - name: Phase 5 - Install Chromium browser
        id: chromium
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx playwright install --with-deps chromium

      # QA-E2E-01..04: exercise navigation, error page, landmarks and headers.
      - name: Phase 5 - Playwright end-to-end tests
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: npm run test:e2e
      - name: Preserve failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: risa-browser-diagnostics
          path: test-results/
          if-no-files-found: ignore

  infrastructure:
    name: Infrastructure-as-code scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: ${{ needs.changes.outputs.iac == 'true' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # QA-IAC-01: run Checkov when Docker/Terraform/Kubernetes manifests exist.
      - name: Phase 4 - Infrastructure-as-code scan (when applicable)
        run: |
          if find . -type f \( -name 'Dockerfile*' -o -name '*.tf' -o -name '*.tf.json' -o -name 'kustomization.yaml' \) -not -path './node_modules/*' | grep -q .; then
            python3 -m pip install --quiet checkov
            checkov -d . --framework dockerfile,terraform,kubernetes --quiet --compact
          else
            echo "No Docker/Terraform/Kubernetes deployment files yet; IaC scan not applicable."
          fi

  dynamic-security:
    name: OWASP ZAP active security scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: ${{ needs.changes.outputs.dast == 'true' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        id: install
        run: npm ci --no-audit --no-fund
      - name: Production build for isolated security scan
        run: npm run build
      # Phase 5 - dynamic baseline and real-browser critical journeys.
      # QA-DAST-01: scan an isolated localhost server with project ZAP rules.
      # tests/security/run-zap.sh manages the server and Docker lifetime.
      - name: Phase 5 - OWASP ZAP isolated active DAST scan
        id: zap
        run: bash tests/security/run-zap.sh

      # Regression: DAST must not leave a local Next.js server occupying port 3000.
      - name: Phase 5 - Verify scanner server cleanup
        if: ${{ !cancelled() && steps.zap.outcome != 'skipped' }}
        run: |
          for attempt in $(seq 1 10); do
            if ! curl --fail --silent --max-time 2 http://127.0.0.1:3000/ > /dev/null; then
              echo "Local Next.js scanner server was cleaned up."
              exit 0
            fi
            sleep 1
          done
          echo "::error title=Orphaned local server::Port 3000 is still used after the ZAP scan."
          exit 1
      # Persist the ZAP report for review even if a security check fails.
      - name: Preserve DAST scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risa-zap-report
          path: zap-report.json
          if-no-files-found: ignore

  portability:
    name: Node.js 24 portability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: ${{ needs.changes.outputs.portability == 'true' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        id: install
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Unit coverage
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:coverage
      - name: Production build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

  # Preserve the existing required status-check name in branch protection.
  required-quality-gate:
    name: RISA Required Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [
        changes,
        code-quality,
        security,
        unit-tests,
        build-browser,
        infrastructure,
        dynamic-security,
        portability,
      ]
    if: ${{ always() }}
    steps:
      - name: Verify all required jobs and applicable extended jobs
        env:
          SCOPE: ${{ needs.changes.result }}
          CODE: ${{ needs.code-quality.result }}
          SECURITY: ${{ needs.security.result }}
          UNIT: ${{ needs.unit-tests.result }}
          BUILD: ${{ needs.build-browser.result }}
          IAC: ${{ needs.infrastructure.result }}
          DAST: ${{ needs.dynamic-security.result }}
          PORT: ${{ needs.portability.result }}
          WANT_IAC: ${{ needs.changes.outputs.iac }}
          WANT_DAST: ${{ needs.changes.outputs.dast }}
          WANT_PORT: ${{ needs.changes.outputs.portability }}
        run: |
          set -euo pipefail
          failed=0
          echo '## RISA quality gate summary' >> "$GITHUB_STEP_SUMMARY"
          required() {
            printf -- '- %s: %s\n' "$1" "$2" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$2" != "success" ]]; then
              echo "::error::$1 returned $2"
              failed=1
            fi
          }
          conditional() {
            if [[ "$2" == "false" && "$3" == "skipped" ]]; then
              printf -- '- %s: not applicable\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            else
              required "$1" "$3"
              if [[ "$2" != "true" ]]; then
                echo "::error::$1 has an unexpected verification scope"
                failed=1
              fi
            fi
          }
          required Scope "$SCOPE"
          required Code "$CODE"
          required Security "$SECURITY"
          required Unit "$UNIT"
          required Build-and-browser "$BUILD"
          conditional IaC "$WANT_IAC" "$IAC"
          conditional DAST "$WANT_DAST" "$DAST"
          conditional Portability "$WANT_PORT" "$PORT"
          exit "$failed"
