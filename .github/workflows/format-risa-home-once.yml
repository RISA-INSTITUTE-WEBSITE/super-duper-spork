name: One-time RISA homepage formatter

on:
  push:
    branches: [chore/website-foundation]

permissions:
  contents: write

jobs:
  format-homepage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Format changed homepage assets
        run: |
          npx prettier --write src/app/page.tsx src/app/globals.css src/components/site-header.tsx src/components/site-footer.tsx
          git diff --check
      - name: Commit formatting only if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/app/page.tsx src/app/globals.css src/components/site-header.tsx src/components/site-footer.tsx
            git commit -m "style(risa): format homepage design"
            git push origin HEAD:chore/website-foundation
          else
            echo "Already formatted"
          fi
