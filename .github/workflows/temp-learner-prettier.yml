name: Temporary Learner Feature Formatting Diff
on:
  push:
    branches:
      - feature/learner-enrolments-content-profile-2026-11-19
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format files and show exact changes
        run: |
          npx prettier --write src/app/students/dashboard/page.tsx src/app/students/profile/page.tsx src/app/students/actions.ts src/app/students/avatar/route.ts 'src/app/students/materials/[id]/route.ts' src/lib/student-auth-api.ts src/lib/student-learning-api.ts tests/unit/student-auth-api.test.ts tests/unit/student-learning-api.test.ts tests/e2e/public-pages.spec.ts
          git --no-pager diff -- src/app/students src/lib/student-auth-api.ts src/lib/student-learning-api.ts tests/unit tests/e2e/public-pages.spec.ts
