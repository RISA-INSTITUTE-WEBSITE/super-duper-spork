name: Temporary Homepage Formatting Diagnostic

on:
  push:
    branches:
      - content/risa-vision-mission-homepage-2026-11-19

permissions:
  contents: read

jobs:
  show-format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Show Prettier formatting patch
        run: |
          npx prettier --write src/app/page.tsx
          git --no-pager diff -- src/app/page.tsx
