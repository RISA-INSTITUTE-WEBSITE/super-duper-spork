name: Verify Animated Dashboard Watermark

on:
  push:
    branches:
      - feat/risa-animated-dashboard-watermark

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'RISA-INSTITUTE-WEBSITE/super-duper-spork'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check formatting of modified dashboard files
        run: npx prettier --check src/app/students/dashboard/page.tsx tests/unit/student-dashboard-layout.test.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
