name: Normalize course creation formatting

on:
  push:
    branches:
      - feat/risa-course-creation-metadata-20261120

permissions:
  contents: write

jobs:
  format-course-files:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Format edited course files
        run: |
          npx prettier --write src/components/admin-create-course-form.tsx tests/unit/risa-course-admin.test.ts
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin-create-course-form.tsx tests/unit/risa-course-admin.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format RISA course creation updates"
            git push origin HEAD:feat/risa-course-creation-metadata-20261120
          fi
