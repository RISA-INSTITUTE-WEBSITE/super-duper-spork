name: Temporary Course Form Prettier
on:
  push:
    branches:
      - feature/admin-create-coded-courses-2026-11-20
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format course form
        run: |
          npx prettier --write src/components/admin-create-course-form.tsx src/app/admin/courses/actions.ts
          git add src/components/admin-create-course-form.tsx src/app/admin/courses/actions.ts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(admin): format course form and role guard"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
