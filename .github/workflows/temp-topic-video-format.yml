name: Temporary Topic-Player Formatting
on:
  push:
    branches:
      - feature/risa-inline-player-topic-thumbnails-2026-11-20
permissions:
  contents: write
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply RISA Prettier styles to topic and video files
        run: |
          npx prettier --write src/lib/youtube-media.ts src/lib/verified-student-course.ts src/components/youtube-thumbnail.tsx src/components/topic-video-player.tsx src/components/student-topic-card.tsx 'src/app/students/courses/[id]/page.tsx' 'src/app/students/courses/[id]/topics/[topicId]/page.tsx' 'src/app/admin/courses/[id]/content/page.tsx' next.config.ts tests/unit/youtube-media.test.ts tests/unit/verified-student-course.test.ts tests/e2e/public-pages.spec.ts docs/course-content-authoring.md
          git add src/lib/youtube-media.ts src/lib/verified-student-course.ts src/components/youtube-thumbnail.tsx src/components/topic-video-player.tsx src/components/student-topic-card.tsx 'src/app/students/courses/[id]/page.tsx' 'src/app/students/courses/[id]/topics/[topicId]/page.tsx' 'src/app/admin/courses/[id]/content/page.tsx' next.config.ts tests/unit/youtube-media.test.ts tests/unit/verified-student-course.test.ts tests/e2e/public-pages.spec.ts docs/course-content-authoring.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(video): apply RISA formatting to topic and player updates"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
