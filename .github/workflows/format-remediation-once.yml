name: One-time remediation document formatter

on:
  push:
    branches: [chore/website-foundation]

permissions:
  contents: write

jobs:
  format-remediation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply Prettier to remediation evidence
        run: |
          npx prettier --write docs/quality/REMEDIATION-2026-11-18.md
          git diff --check
      - name: Commit documentation formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/quality/REMEDIATION-2026-11-18.md
            git commit -m "style(docs): format security remediation report"
            git push origin HEAD:chore/website-foundation
          else
            echo "Already formatted."
          fi
