name: Temporary RISA Inline Video Formatting
on:
  push:
    branches:
      - feature/risa-inline-video-topic-thumbnails-2026-11-20
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply RISA formatter to video and topic changes
        run: |
          npx prettier --write src/components/risa-video-media.tsx src/components/student-course-content.tsx src/components/admin-topic-video-previews.tsx src/app/students/courses/'[id]'/page.tsx src/app/admin/courses/'[id]'/content/page.tsx src/lib/risa-youtube-media.ts next.config.ts tests/unit/risa-youtube-media.test.ts docs/course-content-authoring.md
          git add src/components/risa-video-media.tsx src/components/student-course-content.tsx src/components/admin-topic-video-previews.tsx src/app/students/courses/'[id]'/page.tsx src/app/admin/courses/'[id]'/content/page.tsx src/lib/risa-youtube-media.ts next.config.ts tests/unit/risa-youtube-media.test.ts docs/course-content-authoring.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(videos): format RISA thumbnail and player interface"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
