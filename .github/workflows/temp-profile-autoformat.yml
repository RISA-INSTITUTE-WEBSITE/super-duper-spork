name: Temporary RISA Profile Autoformat
on:
  push:
    branches:
      - fix/risa-learner-profile-update-2026-11-20
permissions:
  contents: write
jobs:
  apply-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply Prettier to profile fixes
        run: |
          npx prettier --write next.config.ts src/proxy.ts src/lib/student-auth-api.ts src/components/student-profile-controls.tsx src/app/students/profile/page.tsx src/app/students/dashboard/page.tsx tests/unit/student-auth-api.test.ts
          git add next.config.ts src/proxy.ts src/lib/student-auth-api.ts src/components/student-profile-controls.tsx src/app/students/profile/page.tsx src/app/students/dashboard/page.tsx tests/unit/student-auth-api.test.ts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(profile): apply Prettier to profile fix"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
