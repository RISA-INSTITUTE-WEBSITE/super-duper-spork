name: Temporary RISA markdown formatting diagnosis

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  show-markdown-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Print read-only Prettier differences for existing report
        run: |
          npx prettier --write docs/quality/failed-tests-summary-2026-11-20/README.md
          git diff -- docs/quality/failed-tests-summary-2026-11-20/README.md
