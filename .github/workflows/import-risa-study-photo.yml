name: Import RISA commitment photo
on:
  push:
    branches:
      - fix/risa-commitment-local-study-photo
    paths:
      - .github/workflows/import-risa-study-photo.yml
permissions:
  contents: write
jobs:
  import-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Save real study photo locally
        run: |
          mkdir -p public/images
          curl --fail --location --retry 3 --silent --show-error \
            'https://images.pexels.com/photos/5039250/pexels-photo-5039250.jpeg' \
            --output public/images/risa-commitment-study.jpg
          file public/images/risa-commitment-study.jpg
          test "$(wc -c < public/images/risa-commitment-study.jpg)" -gt 10000
      - name: Commit image into feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/risa-commitment-study.jpg
          git commit -m "Add RISA commitment study photograph asset"
          git push
