name: RISA auth formatting diagnostic
on:
  push:
    branches:
      - feature/student-signup-without-email-confirmation
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Emit formatted sources
        shell: bash
        run: |
          files=(
            docs/student-accounts.md
            src/app/page.tsx
            src/app/students/privacy/page.tsx
            src/app/students/register/page.tsx
            tests/e2e/public-pages.spec.ts
          )
          npx prettier --write "${files[@]}"
          for file in "${files[@]}"; do
            printf 'FORMATTED_BEGIN:%s\n' "$file"
            base64 -w0 "$file"
            printf '\nFORMATTED_END:%s\n' "$file"
          done
