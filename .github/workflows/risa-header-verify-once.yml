name: Temporary RISA Header Formatting and Browser Verification

on:
  push:
    branches:
      - feat/risa-session-aware-profile-navigation

permissions:
  contents: write

jobs:
  verify:
    if: github.repository == 'RISA-INSTITUTE-WEBSITE/super-duper-spork' && github.actor == 'learnxul-lang'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/risa-session-aware-profile-navigation
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format changed header and test files
        run: |
          npx prettier --write src/components/header-profile-link.tsx src/components/site-header.tsx src/components/mobile-navigation.tsx src/proxy.ts tests/unit/site-header.test.ts tests/e2e/public-pages.spec.ts
      - name: Commit formatted files if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/header-profile-link.tsx src/components/site-header.tsx src/components/mobile-navigation.tsx src/proxy.ts tests/unit/site-header.test.ts tests/e2e/public-pages.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format RISA authenticated header"
            git push origin HEAD:feat/risa-session-aware-profile-navigation
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
