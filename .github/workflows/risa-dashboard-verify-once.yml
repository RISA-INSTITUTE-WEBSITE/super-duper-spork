name: Temporary RISA Dashboard Verification

on:
  push:
    branches:
      - feat/risa-concise-learner-dashboard

permissions:
  contents: write

jobs:
  verify:
    if: github.repository == 'RISA-INSTITUTE-WEBSITE/super-duper-spork' && github.actor == 'learnxul-lang'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/risa-concise-learner-dashboard
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format changed dashboard files
        run: npx prettier --write src/app/students/dashboard/page.tsx tests/unit/student-dashboard-layout.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/students/dashboard/page.tsx tests/unit/student-dashboard-layout.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format concise dashboard"
            git push origin HEAD:feat/risa-concise-learner-dashboard
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
