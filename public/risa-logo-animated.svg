<!-- Original RISA logo with natural black-liquid motion and a smooth outline-free green sphere over solid RISA blue. -->
<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2000" viewBox="0 0 2000 2000" aria-hidden="true" focusable="false">

  <title>Animated RISA logo</title>
  <desc>The original black liquid gently sloshes with subtle depth over the RISA-blue glass, while the green sphere grows and shrinks against blue.</desc>
  <defs>
    <!-- The glass boundary is copied exactly from the original logo path. -->
    <clipPath id="risa-original-glass-interior">
      <path d="M869,578 905,578 936,584 956,591 994,613 1020,637 1041,666 1054,693 1064,734 1064,777 1056,812 1042,843 1023,870 996,896 968,914 935,927 901,933 865,932 833,925 799,910 772,891 747,865 731,841 716,805 710,776 709,744 716,705 730,671 749,643 769,622 800,600 838,584Z"/>
    </clipPath>

    <!-- Permanent RISA-blue backfill prevents the white page showing through gaps. -->
    <linearGradient id="risa-liquid-3d" x1="0%" y1="0%" x2="55%" y2="100%">
      <stop offset="0%" stop-color="#56616a"/>
      <stop offset="32%" stop-color="#383838"/>
      <stop offset="78%" stop-color="#22282e"/>
      <stop offset="100%" stop-color="#101820"/>
    </linearGradient>
    <radialGradient id="risa-orb-3d" cx="32%" cy="24%" r="74%">
      <stop offset="0%" stop-color="#b3fb78"/>
      <stop offset="42%" stop-color="#78eb29"/>
      <stop offset="100%" stop-color="#45a916"/>
    </radialGradient>
  </defs>

  <style>
    /* All shading applies to the original vector paths, not extra liquid. */
    .risa-original-black-liquid {
      fill: url(#risa-liquid-3d);
      animation: risa-natural-surface 5.6s ease-in-out infinite;
    }

    .risa-black-liquid-slosh {
      transform-box: view-box;
      transform-origin: 884px 815px;
      animation: risa-natural-slosh 5.6s ease-in-out infinite;
    }

    .risa-green-orb {
      fill: url(#risa-orb-3d);
      stroke: none;
      shape-rendering: geometricPrecision;
      transform-box: view-box;
      transform-origin: 974px 442px;
      animation: risa-green-orb-size 2.9s ease-in-out infinite;
    }

    /* Change the original liquid contour, rather than sliding a rigid image. */
    @keyframes risa-natural-surface {
      0%, 100% { d: path("M732,748 733,771 741,804 751,826 767,850 783,867 808,886 832,898 858,906 881,909 913,908 948,899 973,887 997,869 1016,849 1033,823 1041,804 991,806 962,800 927,787 843,746 803,734 764,734 738,742Z"); }
      33% { d: path("M732,757 733,777 741,804 751,826 767,850 783,867 808,886 832,898 858,906 881,909 913,908 948,899 973,887 997,869 1016,849 1033,823 1041,793 991,792 962,786 927,775 843,757 803,743 764,742 738,750Z"); }
      66% { d: path("M732,740 733,764 741,804 751,826 767,850 783,867 808,886 832,898 858,906 881,909 913,908 948,899 973,887 997,869 1016,849 1033,823 1041,813 991,815 962,811 927,800 843,740 803,729 764,727 738,737Z"); }
    }

    @keyframes risa-natural-slosh {
      0%, 100% { transform: translate(-2px, 1px) rotate(-0.6deg); }
      50% { transform: translate(2px, -1px) rotate(0.6deg); }
    }

    @keyframes risa-green-orb-size {
      0%, 100% { transform: scale(0.72); }
      50% { transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .risa-original-black-liquid,
      .risa-black-liquid-slosh,
      .risa-green-orb {
        animation: none;
      }
    }
  </style>

