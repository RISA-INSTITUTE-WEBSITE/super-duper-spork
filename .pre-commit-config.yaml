repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy

  # JavaScript/TypeScript hooks use locally installed npm dependencies.
  - repo: local
    hooks:
      - id: risa-prettier
        name: Format website sources with Prettier
        entry: npx --no-install prettier --write
        language: system
        files: '\.(?:[cm]?[jt]sx?|css|json|ya?ml|md)$'
        require_serial: true
      - id: risa-eslint
        name: ESLint staged JavaScript and TypeScript
        entry: npx --no-install eslint --fix
        language: system
        files: '\.(?:[cm]?[jt]sx?)$'
        require_serial: true
